<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>T22 夜间局部试验 134–139</title><style>
body{margin:0;background:#161a20;color:#e7eaf1;font:16px/1.6 system-ui}main{max-width:1600px;margin:24px auto;padding:0 24px}h1{font-size:25px}a{color:#a5c8ff}button,select{background:#293342;color:white;border:1px solid #52617a;padding:9px 13px;border-radius:7px;margin:4px}button.active{background:#48668c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}figure{margin:0;background:#252a32}figcaption{padding:9px}svg{width:100%;display:block}.note{background:#272f3d;padding:16px;border-radius:8px;margin:14px 0}.links{display:flex;gap:18px;flex-wrap:wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style><main>
<h1>卡瑞洛 · T22 局部试验 134–139</h1><p>这是未全部采纳的试验归档。T22 是唯一身份参考，右侧均为实际 Blender 几何渲染。光照不同，阴影深浅不能直接当作相似度。</p><p><a href="T22only-round133.html">保留的 FB133 对照</a> · <a href="overnight-state.json">最新工作状态</a> · <a href="night-2026-10-15.json">具体试验记录</a></p>
<div id="tabs"></div><label>试验版本 <select id="version"></select></label><div id="note" class="note"></div><div class="grid" id="comparison"></div><div class="links" id="links"></div><p>正侧面用于检查连续性；单张 T22 不能唯一确定隐藏面的深度。网格数值检查通过，也不表示人物还原通过。</p>
<script>const groups={"eyes": {"label": "下睑 / 眼窝", "box": "320 400 355 135", "versions": ["FB134_A", "FB134_B", "FB134_C", "FB135_A", "FB135_B", "FB135_C", "FB136_A", "FB136_B", "FB136_C"], "suffix": "orbit-front", "nativeBox": [320, 400, 355, 135], "note": "134 出现眼球穿出皮肤，拒绝。135 修复穿插后收益不明确。136 联动眼球深度与接合面，转面仍显机械，未采纳。"}, "nose": {"label": "鼻尖 / 鼻孔", "box": "405 475 170 160", "versions": ["FB137_A", "FB137_B", "FB137_C"], "suffix": "nose-closeup", "nativeBox": [405, 475, 170, 160], "note": "137A 鼻尖轻抬与前移，局部形态有变化；B/C 鼻孔下缘抬升出现台阶，未采纳。A 尚不足以证明整体相似度提高。"}, "jaw": {"label": "下颌 / 颈部", "box": "290 540 450 280", "versions": ["FB138_A", "FB138_B", "FB138_C"], "suffix": "neutral-front", "nativeBox": [0, 0, 1086, 1448], "note": "正面轮廓比预想接近。138 只改变下颌底面与颈部深度，转面增益很小；强版本趋向刻沟，未采纳。"}, "brow": {"label": "眉形 / 毛发", "box": "320 400 355 135", "versions": ["FB139_A", "FB139_B", "FB139_C"], "suffix": "orbit-front", "nativeBox": [320, 400, 355, 135], "note": "139A/B 双侧重建偏细，表情偏年轻。139C 保留暗侧原眉，仅重建亮侧；是否采纳见最新夜间记录。"}};let selected='eyes';const tabs=document.querySelector('#tabs'),sel=document.querySelector('#version');
function panel(label,src,box,native){return `<figure><figcaption>${label}</figcaption><svg viewBox="${box}"><image href="${src}" x="${native[0]}" y="${native[1]}" width="${native[2]}" height="${native[3]}"/></svg></figure>`}
function render(){const g=groups[selected],v=sel.value;document.querySelector('#comparison').innerHTML=panel('T22 原始参考','references/T22.png',g.box,[0,0,1086,1448])+panel('FB133 保留基线',`renders/fb133-${g.suffix}.png`,g.box,g.nativeBox)+panel(v+' 试验',`renders/${v.toLowerCase()}-${g.suffix}.png`,g.box,g.nativeBox);document.querySelector('#note').textContent=g.note;document.querySelector('#links').innerHTML=`<a href="${v}-candidate.json">该试验的改动与结论</a><a href="Carrillo_FaceBuilder_${v}.blend">该试验的 Blender 工程</a>`;if(['jaw'].includes(selected))document.querySelector('#links').innerHTML+=`<a href="renders/${v.toLowerCase()}-neutral-threequarter.png">实际转面</a><a href="renders/${v.toLowerCase()}-strict-profile.png">实际正交侧面</a>`;}
function choose(k){selected=k;const g=groups[k];sel.innerHTML=g.versions.map(v=>`<option>${v}</option>`).join('');document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.key===k));render()}
for(const [k,g] of Object.entries(groups)){let b=document.createElement('button');b.textContent=g.label;b.dataset.key=k;b.onclick=()=>choose(k);tabs.append(b)}sel.onchange=render;choose('eyes');</script></main></html>
