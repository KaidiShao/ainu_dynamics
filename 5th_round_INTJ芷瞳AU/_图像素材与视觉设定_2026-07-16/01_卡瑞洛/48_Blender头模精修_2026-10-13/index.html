<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>卡瑞洛 · 原图与模型校准</title><style>
*{box-sizing:border-box}body{margin:0;background:#161719;color:#ece5d9;font:15px/1.65 "Microsoft Yahei",sans-serif}main{max-width:1230px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:start;gap:20px}h1{font-size:25px;font-weight:500;margin:0}.tag{font-size:12px;border:1px solid #8b6552;border-radius:20px;padding:5px 12px;color:#e2b29a;white-space:nowrap}p{color:#bcb5a8;margin:8px 0 16px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}button,a.link{font:inherit;font-size:13px;padding:8px 13px;background:#262725;color:#e7e0d4;border:1px solid #625b4d;border-radius:5px;cursor:pointer;text-decoration:none}button.active{background:#d8c7a9;color:#221e17}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.grid.overlay{grid-template-columns:1fr;max-width:660px;margin:auto}.grid.overlay .second{display:none}figure{margin:0;background:#242422;border:1px solid #373734;border-radius:8px;overflow:hidden}figcaption{padding:10px 14px;display:flex;justify-content:space-between}figcaption small{color:#a5a097}canvas{width:100%;display:block;background:#101111}.controls{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin:16px 0}.controls label{color:#c7bfaf;font-size:13px}#mixControl[hidden]{display:none}input[type=range]{width:180px;vertical-align:middle}section.notes{border-top:1px solid #3a3732;margin-top:22px;padding-top:16px}.notes strong{font-weight:500;color:#e5d1b3}.notes p{font-size:14px}.notice{font-size:12px;color:#999386}.foot{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.error{color:#e1a58b}@media(max-width:650px){main{padding:14px}.grid{gap:7px}h1{font-size:20px}figcaption{font-size:12px;padding:8px}figcaption small{display:none}header{display:block}.tag{display:inline-block;margin-top:10px}}
</style></head><body><main>
<header><div><h1>卡瑞洛 · 原图与模型校准</h1><p>先对齐眼睛的间距和画面旋转，再看具体形状。</p></div><span class="tag">V9：作者认为仍不像</span></header>
<nav><button class="active" data-region="face">全脸</button><button data-region="eyes">眉眼</button><button data-region="lower">鼻嘴与下巴</button><button id="overlay">半透明叠合</button></nav>
<div class="grid" id="grid"><figure><figcaption><span id="leftLabel">认可正面 T22</span><small>身份参考</small></figcaption><canvas id="refCanvas" width="512" height="580"></canvas></figure><figure class="second"><figcaption><span>当前模型 V9</span><small>工作试验 · 非定稿</small></figcaption><canvas id="modelCanvas" width="512" height="580"></canvas></figure></div>
<div class="controls"><label><input type="checkbox" id="lines"> 显示参考线与估计轮廓</label><label id="mixControl" hidden>模型透明度 <input id="mix" type="range" min="0" max="1" step=".01" value=".5"></label></div>
<p class="notice">仅统一画面内旋转和眼间距，未统一头部俯仰、左右转角、镜头或表情。轮廓来自自动检测，可能受到贴图影响，不能当作骨骼测量。</p>
<section class="notes"><p><strong>当前判断：</strong>缩窄脸颊改善了胖瘦，尚未解决人物身份。大比例接近，也不足以证明五官与立体结构一致。</p><p>优先核对眼睑与眼球的包裹关系、眉弓至鼻梁的转折，以及鼻尖和唇颏形状。不要继续依据“看着不够锋利”整体削脸或压眉。</p></section>
<div class="foot"><a class="link" href="/model-v9.html">查看 V9 旋转模型</a><a class="link" href="/compare-face-volume.html">查看此前胖瘦修改</a><a class="link" href="/Carrillo_3D_working.blend" download>保留的 Blender 工程</a></div><p id="error" class="error"></p>
</main><script>
let data,images={},region='face',overlay=false,mix=.5,lines=false;
const canvases=[document.querySelector('#refCanvas'),document.querySelector('#modelCanvas')];
const presets={face:{zoom:1,x:256,y:282},eyes:{zoom:2.1,x:256,y:195},lower:{zoom:1.55,x:256,y:355}};
function transform(ctx){const p=presets[region];ctx.translate(256,290);ctx.scale(p.zoom,p.zoom);ctx.translate(-p.x,-p.y);}
function portrait(ctx,key,alpha=1){const d=data.images[key];ctx.save();transform(ctx);ctx.globalAlpha=alpha;ctx.transform(...d.matrix);ctx.drawImage(images[key],0,0);ctx.restore();}
function outline(ctx,key,color){const d=data.images[key];ctx.save();transform(ctx);ctx.strokeStyle=color;ctx.lineWidth=.8/presets[region].zoom;ctx.globalAlpha=.8;for(const ids of Object.values(data.groups)){ctx.beginPath();ids.forEach((i,n)=>{const p=d.points[i];if(n)ctx.lineTo(...p);else ctx.moveTo(...p);});ctx.stroke();}ctx.setLineDash([3,4]);ctx.strokeStyle='#d9ccb2';ctx.beginPath();ctx.moveTo(90,205);ctx.lineTo(422,205);ctx.moveTo(256,140);ctx.lineTo(256,470);ctx.stroke();ctx.restore();}
function draw(){if(!data)return;canvases.forEach((cv,i)=>{const ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,512,580);ctx.fillStyle='#111';ctx.fillRect(0,0,512,580);const key=i?'V9':'T22';portrait(ctx,key);if(overlay&&!i)portrait(ctx,'V9',mix);if(lines){outline(ctx,key,i?'#7bbfce':'#e9c58c');if(overlay&&!i)outline(ctx,'V9','#7bbfce');}});}
document.querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=b.dataset.region;document.querySelectorAll('[data-region]').forEach(x=>x.classList.toggle('active',x===b));draw();});
document.querySelector('#overlay').onclick=e=>{overlay=!overlay;document.querySelector('#grid').classList.toggle('overlay',overlay);document.querySelector('#mixControl').hidden=!overlay;e.target.classList.toggle('active',overlay);e.target.textContent=overlay?'返回并排对照':'半透明叠合';document.querySelector('#leftLabel').textContent=overlay?'T22 与 V9 叠合':'认可正面 T22';draw();};
document.querySelector('#mix').oninput=e=>{mix=Number(e.target.value);draw();};
document.querySelector('#lines').onchange=e=>{lines=e.target.checked;draw();};
(async()=>{try{data=await(await fetch('/likeness-alignment-v9.json')).json();await Promise.all(Object.keys(data.images).map(key=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[key]=im;resolve();};im.onerror=()=>reject(Error('参考图载入失败'));im.src=data.images[key].url;})));draw();window.calibrationReady=true;}catch(e){document.querySelector('#error').textContent=e.message;console.error(e);}})();
</script></body></html>
