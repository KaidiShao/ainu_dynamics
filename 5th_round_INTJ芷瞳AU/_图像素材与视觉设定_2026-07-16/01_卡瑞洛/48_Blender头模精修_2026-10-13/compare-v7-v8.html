</style><main><h1>脸颊与下颌 · 修改前后</h1><p>相同相机、打光与材质。重点看颧骨下方体积和下颌收束；整体人物相似度仍未通过。</p><nav><button data-view="threequarter" class="active">3/4</button><button data-view="front">正面</button><button data-view="neutral">去贴图</button><button data-view="near-profile">近侧面</button><a href="/model-v9.html">返回旋转模型</a></nav><div class="grid"><figure><figcaption>修改前 · V7</figcaption><img id="before" src="/renders/refined-v7-threequarter.png" alt="修改前"></figure><figure><figcaption>修改后 · V8</figcaption><img id="after" src="/renders/refined-v8-threequarter.png" alt="收脸颊和下颌后"></figure></div><p><small>原工程和形体均已保留。本轮调整可以在 Blender 的 V8_cheek_and_jaw_planes 形态键中从 0 到 1 调节。</small></p></main><script>document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelector('#before').src='/renders/refined-v7-'+b.dataset.view+'.png';document.querySelector('#after').src='/renders/refined-v8-'+b.dataset.view+'.png';document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));});</script></html>
