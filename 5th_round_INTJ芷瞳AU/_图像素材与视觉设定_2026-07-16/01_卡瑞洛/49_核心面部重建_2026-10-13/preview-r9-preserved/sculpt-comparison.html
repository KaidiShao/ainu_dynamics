<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>卡瑞洛 · R8 / R9 结构对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#171819;color:#e7e2d8;font:15px/1.7 "Microsoft Yahei",sans-serif}main{max-width:1320px;margin:auto;padding:24px}h1{font-size:24px;font-weight:500;margin:0}p{color:#aaa69b;margin:8px 0 16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,a{font:inherit;font-size:13px;color:#ded6c4;background:#292a28;border:1px solid #635d50;border-radius:5px;padding:7px 12px;text-decoration:none;cursor:pointer}button.active{background:#d1c09e;color:#242019}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;background:#222;border:1px solid #3c3a34;border-radius:7px;overflow:hidden}figcaption{padding:9px 14px}img{display:block;width:100%}.imagewrap{position:relative}.imagewrap img.overlay{position:absolute;inset:0;opacity:0;pointer-events:none}.grid.mixed{max-width:660px;display:block;margin:auto}.grid.mixed figure:nth-child(2){display:none}label{color:#beb7a7;font-size:13px}input[type=range]{vertical-align:middle}footer{margin-top:18px;font-size:13px;color:#aaa69b}#mixPanel[hidden]{display:none}@media(max-width:700px){main{padding:14px}.grid{gap:6px}figcaption{font-size:12px;padding:7px}h1{font-size:20px}}
</style></head><body><main><h1>卡瑞洛 · R8 → R9 结构对照</h1><p>检查鼻梁高度与鼻翼宽度。正侧面可直接比较鼻梁的前突。两版使用相同机位与灯光。</p>
<nav><button data-view="nose-neutral" class="active">鼻部正面 · 去贴图</button><button data-view="nose-side-neutral">鼻部转面 · 去贴图</button><button data-view="nose-profile-neutral">鼻部正侧面 · 去贴图</button><button data-view="neutral">45° 去贴图</button><button data-view="front-neutral">正面去贴图</button><button data-view="front">正面贴图</button><button data-view="threequarter">45° 贴图</button><button data-view="near-profile">近侧面贴图</button><button id="overlay">叠合观察</button></nav>
<p id="mixPanel" hidden><label>R9 透明度 <input type="range" id="mix" min="0" max="1" step="0.01" value="0.5"></label></p>
<div class="grid" id="grid"><figure><figcaption id="leftLabel">R8 · 修改前</figcaption><div class="imagewrap"><img id="before" src="/renders/core-r8-nose-neutral.png" alt="R8 鼻部无贴图近景"><img id="superimposed" class="overlay" src="/renders/core-r9-nose-neutral.png" alt="R9 叠合"></div></figure><figure><figcaption>R9 · 本轮结构调整，待评价</figcaption><img id="after" src="/renders/core-r9-nose-neutral.png" alt="R9 鼻部无贴图近景"></figure></div>
<nav><a href="/">旋转 R9 模型</a><a href="/comparison.html">与认可正面 T22 对齐</a><a href="/Carrillo_core_rebuild_R9.blend" download>Blender 工程</a></nav>
<footer>R8 的鼻型已被作者否定。R9 同时调整鼻梁前突和鼻翼形态，请分别看正面宽度与正侧面高度。当前仍为待评价工作稿，人物相似度未通过。</footer>
</main><script>
const before=document.querySelector('#before'),after=document.querySelector('#after'),superimposed=document.querySelector('#superimposed');let mixed=false;
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;before.src='/renders/core-r8-'+v+'.png';after.src=superimposed.src='/renders/core-r9-'+v+'.png';before.alt='R8 '+b.textContent;after.alt='R9 '+b.textContent;document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));});
function mix(){superimposed.style.opacity=mixed?document.querySelector('#mix').value:0;}
document.querySelector('#overlay').onclick=e=>{mixed=!mixed;document.querySelector('#grid').classList.toggle('mixed',mixed);document.querySelector('#mixPanel').hidden=!mixed;e.target.classList.toggle('active',mixed);document.querySelector('#leftLabel').textContent=mixed?'R8 / R9 同机位叠合':'R8 · 修改前';mix();};document.querySelector('#mix').oninput=mix;
</script></body></html>
